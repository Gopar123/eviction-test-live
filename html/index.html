<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publisher</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Publisher Weekly</h1>
        </div>
        <div class="nav-items">
            <nav>
                <a href="#">Membership</a>
                <a href="#">Resources</a>
                <a href="#">Events</a>
            </nav>
        </div>
        <div class="btns">
            <div id="in-btn">
                <button>Sign In</button>
            </div>
            <div id="up-btn">
                <button>Sign Up</button>
        </div>
    </header>

    <main>
        <div class="home-pg">
            
            <div id="title">
                <h1>Ideas that inspire, <b>inform, and entertain</b></h1>
            </div>

            <div id="paragraph"><p>Publisher Weekly celebrates, inspires and supports independent publishing. On a weely basis, we explore the best in creativity and deliver news, inspirations, insight and advice to help you succeed.</p></div>
            
        </div>

         <div class="mail">
            <form action="">
                <input type="text" id="email" placeholder="Your email">
                <button class="sub-btn">Subscribe</button>
            </form>
        </div>
      
        <div class="img">
            <img src="/img/download (2).jpg" alt="image">
        </div>
       
    </main>
</body>
</html>
